    <style>

        header { width: 100%; background: linear-gradient(135deg, #00d2ff, #3a7bd5); padding: 15px 0; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); color: #000; }
        header h1 { margin: 5px 0; font-size: 1.5rem; }
        header p { margin: 0; font-size: 0.9rem; }
        
        .banner-top, .banner-bottom { width: 100%; text-align: center; background: #0a0e15; padding: 15px 0; margin: 0 auto; display: flex; justify-content: center; align-items: center; border-radius: 12px; overflow-x: auto; }
        .banner-top { max-width: 900px; margin-top: 10px; margin-bottom: 5px; }
        .banner-bottom { max-width: 900px; margin-top: 20px; margin-bottom: 20px; }
        
        .main-container { max-width: 900px; width: 95%; margin: 0 auto; text-align: center; }
        
        .back-home-btn { background: #252f44; color: white; border: none; padding: 8px 15px; border-radius: 8px; font-family: 'Cairo', sans-serif; font-weight: bold; cursor: pointer; margin: 10px 0; transition: 0.3s; display: inline-flex; align-items: center; gap: 5px; text-decoration: none; font-size: 0.9rem; }
        .back-home-btn:hover { background: var(--primary); color: #000; }

        .video-wrapper-outer { position: relative; z-index: 1; width: 100%; }
        .video-display-area { background: #000; border-radius: 15px; overflow: hidden; border: 3px solid var(--primary); box-shadow: 0 0 20px rgba(0, 210, 255, 0.2); margin-bottom: 20px; display: none; position: relative; }
        .responsive-iframe { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
        .responsive-iframe iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; overflow: hidden; pointer-events: auto; }
        
        .section-title { font-size: 1.2rem; margin: 15px 0 10px 0; color: var(--primary); }
        .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(55px, 1fr)); gap: 10px; background: var(--card); padding: 15px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .ep-btn { background: #252f44; color: white; border: 2px solid transparent; padding: 12px 0; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; font-family: 'Cairo', sans-serif; }
        .ep-btn:hover { background: var(--primary); transform: scale(1.05); border-color: white; color: #000; }
        .ep-btn.active { background: var(--accent); color: black; box-shadow: 0 0 12px var(--accent); }

        .info-text { margin-top: 15px; color: var(--primary); font-size: 0.85rem; }
        footer { margin-top: 30px; padding: 15px; opacity: 0.4; text-align: center; font-size: 0.8rem; }
        
        @media (max-width: 600px) { 
            .episodes-grid { grid-template-columns: repeat(auto-fill, minmax(45px, 1fr)); gap: 8px; padding: 10px; } 
            .ep-btn { padding: 10px 0; font-size: 0.9rem; }

    </style>
</head>
